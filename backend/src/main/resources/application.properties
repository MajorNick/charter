spring.application.name=charter-backend
server.port=${PORT:8080}
server.shutdown=graceful


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5333/crocobet-local?currentSchema=charter_schema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true

info.app.name=Charter
info.app.mode=${app.mode}
info.app.version=${app.version}
info.app.deploy-environment=${app.deploy-environment}
info.app.commit-sha=${app.commit-sha}
info.backend.runtime=spring-boot
info.template.persistence=postgres-json
info.template.processing=client-side
info.template.share-transport=ulid-route
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
