spring.application.name=charter-backend
server.port=${PORT:4000}
server.shutdown=graceful

app.mode=persisted-template-mvp
app.deploy-environment=${APP_DEPLOY_ENV:local}
app.version=${APP_VERSION:0.1.0}
app.commit-sha=${APP_COMMIT_SHA:local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=jdbc:h2:mem:charter;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true

info.app.name=Charter
info.app.mode=${app.mode}
info.app.version=${app.version}
info.app.deploy-environment=${app.deploy-environment}
info.app.commit-sha=${app.commit-sha}
info.backend.runtime=spring-boot
info.template.persistence=postgres-json
info.template.processing=client-side
info.template.share-transport=ulid-route
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
